    <text x="256" y="300" font-family="Georgia, 'Times New Roman', serif" font-size="150" font-weight="bold" fill="#4f6ef7" text-anchor="middle">A</text>
    <rect x="150" y="338" width="130" height="14" rx="7" fill="#c9d4f7"/>
